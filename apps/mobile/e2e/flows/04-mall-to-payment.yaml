# 商城 → 加购 → 结算 → 支付（设计文档 §4.5）
appId: com.yuanxi.health
name: 交易闭环
---
- runFlow: 01-privacy-and-login.yaml

- tapOn: '商城'
- tapOn: '元息脉搏环 Pro 智能健康监测设备'

- tapOn: '加入购物车'
- tapOn: '星空灰 · 标准版'
- tapOn: '加入购物车'

- tapOn: '购物车'
- tapOn:
    id: 'cart-checkout'

- assertVisible: '确认订单'
- tapOn:
    id: 'checkout-submit'

# §4.5.5：本页是元息自有确认卡片，不得仿制微信收银台
- extendedWaitUntil:
    visible: '确认支付'
    timeout: 10000
- assertVisible: '支付由微信支付提供安全保障'
- tapOn:
    id: 'pay-confirm'

# §3.4：支付结果以服务端订单状态为准
- extendedWaitUntil:
    visible: '支付成功'
    timeout: 20000
- assertVisible: '健康积分'
